<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画視聴ページ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: #fff;
    color: #333;
    min-height: 100vh;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* 動画エリア */
  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .video-wrapper iframe,
  .video-wrapper video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* プレースホルダー（動画未設定時） */
  .video-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
    color: #666;
    font-size: 18px;
  }

  /* CTAボタン */
  .cta-section {
    margin-top: 48px;
    text-align: center;
  }

  .cta-btn {
    display: inline-block;
    background: linear-gradient(180deg, #5cbf2a, #3d9c14);
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    font-weight: 700;
    padding: 22px 48px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    letter-spacing: 1px;
    box-shadow: none;
    transition: transform 0.2s, box-shadow 0.2s;
    line-height: 1.5;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: none;
  }
  .cta-btn:active {
    transform: translateY(0);
  }

  /* パルスアニメーション */
  .cta-pulse {
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .cta-sub {
    margin-top: 12px;
    font-size: 13px;
    color: #888;
  }

  @media (max-width: 600px) {
    .container {
      padding: 24px 16px 60px;
    }
    .cta-btn {
      font-size: 17px;
      padding: 18px 32px;
      display: block;
      margin: 0 12px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 動画エリア -->
  <div class="video-wrapper">
    <iframe src="https://www.youtube.com/embed/dqAmDzq86jo" allowfullscreen></iframe>
  </div>

  <!-- CTAボタン -->
  <div class="cta-section">
    <a href="https://1216ssfw-collab.github.io/shindan-form/" class="cta-btn cta-pulse">
      営業診断会（無料個別相談）に申し込む
    </a>
    <p class="cta-sub">※無料・60分・Zoom開催</p>
  </div>

</div>

</body>
</html>
