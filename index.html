<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動画視聴ページ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: #fff;
    color: #333;
    min-height: 100vh;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* 動画エリア */
  .video-wrapper {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%; /* 16:9 */
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }
  .video-wrapper iframe,
  .video-wrapper video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* プレースホルダー（動画未設定時） */
  .video-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #222;
    color: #666;
    font-size: 18px;
  }

  /* カウントダウン */
  .countdown-section {
    text-align: center;
    margin-bottom: 32px;
  }
  .countdown-title {
    font-size: 26px;
    font-weight: 900;
    color: #222;
    margin-bottom: 4px;
  }
  .countdown-sub {
    font-size: 15px;
    color: #c0392b;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .countdown-boxes {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .countdown-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .countdown-num {
    background: #3a3a3a;
    color: #fff;
    font-size: 36px;
    font-weight: 700;
    min-width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-variant-numeric: tabular-nums;
  }
  .countdown-label {
    font-size: 13px;
    color: #666;
    margin-top: 6px;
  }

  /* 期限切れ */
  .expired-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 18px;
    border-radius: 8px;
    z-index: 20;
  }

  /* CTAボタン */
  .cta-section {
    margin-top: 48px;
    text-align: center;
  }

  .cta-btn {
    display: inline-block;
    background: linear-gradient(180deg, #5cbf2a, #3d9c14);
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    font-weight: 700;
    padding: 22px 48px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.3);
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    letter-spacing: 1px;
    box-shadow: none;
    transition: transform 0.2s, box-shadow 0.2s;
    line-height: 1.5;
  }
  .cta-btn:hover {
    transform: translateY(-2px);
    box-shadow: none;
  }
  .cta-btn:active {
    transform: translateY(0);
  }

  /* パルスアニメーション */
  .cta-pulse {
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .cta-sub {
    margin-top: 12px;
    font-size: 13px;
    color: #888;
  }

  /* カスタム再生ボタン */
  .video-thumb {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }
  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .video-wrapper:hover .play-btn {
    opacity: 0.85;
  }

  /* YouTubeロゴ隠し */
  .yt-logo-cover {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 140px;
    height: 44px;
    z-index: 10;
    pointer-events: none;
    background: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.6) 40%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .video-wrapper.playing .yt-logo-cover {
    opacity: 1;
  }
  /* YouTubeウォーターマーク隠し（動画中央右下に出るロゴ） */
  .yt-watermark-cover {
    position: absolute;
    bottom: 50px;
    right: 12px;
    width: 50px;
    height: 30px;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
  }
  .video-wrapper.playing .yt-watermark-cover {
    opacity: 1;
  }

  @media (max-width: 600px) {
    .container {
      padding: 24px 16px 60px;
    }
    .cta-btn {
      font-size: 17px;
      padding: 18px 32px;
      display: block;
      margin: 0 12px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- カウントダウン -->
  <div class="countdown-section">
    <p class="countdown-title">アーカイブ視聴ページ</p>
    <p class="countdown-sub">※動画視聴期限は2日間です</p>
    <div class="countdown-boxes">
      <div class="countdown-unit">
        <div class="countdown-num" id="cd-days">0</div>
        <span class="countdown-label">日</span>
      </div>
      <div class="countdown-unit">
        <div class="countdown-num" id="cd-hours">00</div>
        <span class="countdown-label">時間</span>
      </div>
      <div class="countdown-unit">
        <div class="countdown-num" id="cd-mins">00</div>
        <span class="countdown-label">分</span>
      </div>
      <div class="countdown-unit">
        <div class="countdown-num" id="cd-secs">00</div>
        <span class="countdown-label">秒</span>
      </div>
    </div>
  </div>

  <!-- 動画エリア -->
  <div class="video-wrapper" id="videoWrapper" onclick="playVideo()">
    <img class="video-thumb" src="https://img.youtube.com/vi/dqAmDzq86jo/maxresdefault.jpg" alt="動画サムネイル">
    <div class="play-btn">
      <svg viewBox="0 0 68 48" width="68" height="48">
        <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.64 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="rgba(0,0,0,0.7)"/>
        <path d="M45 24L27 14v20" fill="#fff"/>
      </svg>
    </div>
  </div>

  <!-- CTAボタン -->
  <div class="cta-section">
    <a href="https://1216ssfw-collab.github.io/shindan-form/" class="cta-btn cta-pulse">
      営業診断会（無料個別相談）に申し込む
    </a>
    <p class="cta-sub">※無料・60分・Zoom開催</p>
  </div>

</div>

<script>
var LIMIT_MS = 2 * 24 * 60 * 60 * 1000; // 2日
var KEY = 'video_lp_first_visit';
var firstVisit = localStorage.getItem(KEY);
if (!firstVisit) {
  firstVisit = Date.now();
  localStorage.setItem(KEY, firstVisit);
} else {
  firstVisit = Number(firstVisit);
}
var deadline = firstVisit + LIMIT_MS;
var expired = false;

function updateCountdown() {
  var remaining = deadline - Date.now();
  if (remaining <= 0) {
    remaining = 0;
    if (!expired) {
      expired = true;
      showExpired();
    }
  }
  var s = Math.floor(remaining / 1000);
  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600); s -= h * 3600;
  var m = Math.floor(s / 60); s -= m * 60;
  document.getElementById('cd-days').textContent = d;
  document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
  document.getElementById('cd-mins').textContent = String(m).padStart(2, '0');
  document.getElementById('cd-secs').textContent = String(s).padStart(2, '0');
}

function showExpired() {
  var wrapper = document.getElementById('videoWrapper');
  wrapper.innerHTML = '<div class="expired-overlay">視聴期限が終了しました</div>';
  wrapper.onclick = null;
}

function playVideo() {
  if (expired) return;
  var wrapper = document.getElementById('videoWrapper');
  wrapper.innerHTML = '<iframe src="https://www.youtube.com/embed/dqAmDzq86jo?autoplay=1&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&cc_load_policy=0" allowfullscreen allow="autoplay"></iframe><div class="yt-logo-cover"></div><div class="yt-watermark-cover"></div>';
  wrapper.classList.add('playing');
  wrapper.onclick = null;
}

updateCountdown();
setInterval(updateCountdown, 1000);
if (expired) showExpired();
</script>
</body>
</html>
